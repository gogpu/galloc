name: CI

# GitHub Flow: main is always releasable; work happens in short-lived branches via PRs.
# Go: oldstable + stable (the two supported releases), plus the go.mod minimum for libraries.
# The ruleset requires ONE check, the "Test" gate at the end: jobs and the matrix can change
# without touching the ruleset. A new required job goes into the gate's `needs`.
# Tool versions are pinned and bumped on purpose (SKILL.md § Versions): an unpinned tool
# breaks every PR at once when its new release lands.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Never download a newer Go behind our back: the job must run the Go it asked for, or
  # the minimum and oldstable tests prove nothing.
  GOTOOLCHAIN: local

jobs:
  test:
    name: Test - ${{ matrix.os }} - Go ${{ matrix.go-version }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write # Codecov OIDC — only this job needs it
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: [oldstable, stable]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Verify modules
        run: go mod verify
      - name: Vet
        if: matrix.os == 'ubuntu-latest'
        run: go vet ./...
      - name: Test (race)
        shell: bash
        run: go test -race -count=1 -coverprofile=coverage.txt -covermode=atomic ./...
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == 'stable'
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          use_oidc: true
          files: ./coverage.txt

  # Libraries: the go.mod `go` line is a promise to every importer, and this machine never
  # tests it (it builds with GOTOOLCHAIN >= go1.27.3). Read from the `go` line, not with
  # go-version-file: setup-go prefers a `toolchain` line when one exists.
  # Programs (CLI, service): delete this job and its entry in the gate's `needs`.
  test-minimum:
    name: Test - ubuntu-latest - Go minimum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: gomod
        run: echo "go=$(awk '$1 == "go" { print $2; exit }' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.gomod.outputs.go }}
          cache: true
      - run: go version
      - run: go test -count=1 ./...

  # Remove if the module cannot support 32-bit; keep for libraries.
  build-386:
    name: Build - linux 386
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - run: GOARCH=386 go build ./...
      - run: GOARCH=386 go test -count=1 ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          # Exact version (golangci-lint docs: "don't start to fail all builds at the same
          # time"). Bump in its own PR that fixes the new findings, and with each new Go
          # minor: an older linter may not understand the new Go.
          version: v2.15.0
          args: --timeout=5m

  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-ed:"; echo "$unformatted"; exit 1
          fi
      - name: go mod tidy
        run: |
          go mod tidy
          # tools/ is a separate module (SKILL.md § Versions); tidy it too when present.
          if [ -f tools/go.mod ]; then go -C tools mod tidy; fi
          if [ -n "$(git status --porcelain -- go.mod go.sum tools/go.mod tools/go.sum)" ]; then
            echo "go mod tidy changed go.mod/go.sum (a new untracked go.sum counts):"
            git status --porcelain -- go.mod go.sum tools/go.mod tools/go.sum
            git diff -- go.mod go.sum tools/go.mod tools/go.sum; exit 1
          fi

  # Informational: not in the gate, so a new CVE in a dependency does not block unrelated
  # PRs. A red run is still treated as a task (fix or report). It stays on the latest
  # govulncheck on purpose: the vulnerability data must be current.
  # continue-on-error at job level: a finding with no fixed version yet (govulncheck exit 3)
  # still shows this job red in every PR, but the run concludes success, so the README badge
  # stays green. Releases are protected by the blocking govulncheck in release.yml. A finding
  # that has a fixed version is fixed by updating, never left to this.
  vulncheck:
    name: Vulncheck
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: stable

  # The allocator's invariants (no overlap, full coalescing) are checked by random
  # alloc/free sequences; 30 s each keeps the job short.
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - run: go test -run '^$' -fuzz=FuzzAllocFree -fuzztime=30s .
      - run: go test -run '^$' -fuzz=FuzzAllocAligned -fuzztime=30s .

  # The one required check. `if: always()` and the explicit result check matter: a job that
  # is skipped (for example because a job it needs failed) counts as passed for a required
  # check, so a gate without them can let a red PR through.
  gate:
    name: Test
    if: always()
    needs: [test, test-minimum, build-386, lint, formatting, fuzz]
    runs-on: ubuntu-latest
    steps:
      - name: Every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != success ]; then echo "a required job ended with: $r"; exit 1; fi
          done

version: "2"

run:
  timeout: 5m

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - errorlint
    - gosec
    - ineffassign
    - misspell
    - unconvert
    - unparam
    - goconst
    - gocritic
    - gocyclo
    - funlen
    - revive

  settings:
    gocyclo:
      min-complexity: 20
    funlen:
      lines: 120
      statements: 60
    gosec:
      excludes:
        # G115: int→uint32 from math/bits functions (LeadingZeros32, TrailingZeros32)
        # returns [0,32] which is always safe for uint32 cast.
        - G115

  exclusions:
    rules:
      # Exclude complexity checks for test files.
      - path: _test\.go
        linters:
          - funlen
          - gocyclo
          - goconst
